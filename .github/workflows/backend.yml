name: Backend

# Runs the reactor with the end-to-end suites ENABLED.
#
# This file exists because of a specific failure, not as boilerplate. The suites carrying the SRS
# mandatory-scenario evidence for S166, S168_fuel, S171 and S174 resolve their database from
# SFL_*_TEST_DB_URL first and Testcontainers second. Nothing set those variables and the Java Docker
# client could not reach the daemon on the development platform, so 102 tests skipped on every run for
# four build passes — and a skip reads as a pass in a summary line. Producing that evidence must not
# depend on a developer remembering an environment variable.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # One database per service, matching the schema-per-service boundary. They are separate
      # containers rather than separate schemas in one, so a test cannot accidentally reach across a
      # boundary the architecture forbids and still pass.
      facilities-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sfl
          POSTGRES_PASSWORD: sfl
          POSTGRES_DB: sfl_facilities_migration_test
        ports: ['55441:5432']
        options: >-
          --health-cmd "pg_isready -U sfl"
          --health-interval 10s --health-timeout 5s --health-retries 10

      fleet-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sfl
          POSTGRES_PASSWORD: sfl
          POSTGRES_DB: sfl__fleet_vehicle_service_e2e
        ports: ['55443:5432']
        options: >-
          --health-cmd "pg_isready -U sfl"
          --health-interval 10s --health-timeout 5s --health-retries 10

      emergency-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sfl
          POSTGRES_PASSWORD: sfl
          POSTGRES_DB: sfl_emergency_notification_service_e2e
        ports: ['55445:5432']
        options: >-
          --health-cmd "pg_isready -U sfl"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      SFL_FACILITIES_TEST_DB_URL: jdbc:postgresql://localhost:55441/sfl_facilities_migration_test
      SFL_FLEET_LOGISTICS_TEST_DB_URL: jdbc:postgresql://localhost:55443/sfl__fleet_vehicle_service_e2e
      SFL_EMERGENCY_NOTIFICATION_TEST_DB_URL: jdbc:postgresql://localhost:55445/sfl_emergency_notification_service_e2e
      SFL_TEST_DB_USERNAME: sfl
      SFL_TEST_DB_PASSWORD: sfl

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # `clean` deliberately, never an incremental target. Stale surefire XML from deleted test
      # classes has already produced six phantom failures for anything parsing that directory while
      # the build itself was green.
      - name: Build and test
        working-directory: services
        run: ../mvnw -B clean test -pl sfl-service-common,sfl-facilities-service,sfl-fleet-logistics-service,sfl-emergency-notification-service,sfl-asset-visibility-service
        shell: bash

      # The check this file exists for. A green build that skipped the mandatory scenarios is not
      # evidence, so the count is asserted rather than eyeballed. Raise the threshold only with a
      # reason recorded in the commit message.
      - name: Fail if the mandatory-scenario suites skipped
        working-directory: services
        shell: bash
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' */target/surefire-reports/*.xml \
            | sed 's/[^0-9]//g' | awk '{s+=$1} END {print s+0}')
          echo "Total skipped: $skipped"
          if [ "$skipped" -gt 0 ]; then
            echo "::error::$skipped test(s) skipped. The e2e suites must run in CI — check the SFL_*_TEST_DB_URL variables and the service containers."
            grep -l 'skipped="[1-9]' */target/surefire-reports/*.xml || true
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/sfl-operations-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/sfl-operations-ui/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
