services:
  facilities-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${SFL_FACILITIES_POSTGRES_USER:-sfl}
      POSTGRES_PASSWORD: ${SFL_FACILITIES_POSTGRES_PASSWORD:-sfl}
      POSTGRES_DB: ${SFL_FACILITIES_POSTGRES_DB:-sfl_facilities_service}
    ports:
      - "5441:5432"
    volumes:
      - sfl_facilities_postgres_data:/var/lib/postgresql/data

  safety-security-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${SFL_SAFETY_SECURITY_POSTGRES_USER:-sfl}
      POSTGRES_PASSWORD: ${SFL_SAFETY_SECURITY_POSTGRES_PASSWORD:-sfl}
      POSTGRES_DB: ${SFL_SAFETY_SECURITY_POSTGRES_DB:-sfl_safety_security_service}
    ports:
      - "5442:5432"
    volumes:
      - sfl_safety_security_postgres_data:/var/lib/postgresql/data

  fleet-vehicle-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${SFL_FLEET_LOGISTICS_POSTGRES_USER:-sfl}
      POSTGRES_PASSWORD: ${SFL_FLEET_LOGISTICS_POSTGRES_PASSWORD:-sfl}
      POSTGRES_DB: ${SFL_FLEET_LOGISTICS_POSTGRES_DB:-sfl__fleet_vehicle_service}
    ports:
      - "5443:5432"
    volumes:
      - sfl_fleet_vehicle_postgres_data:/var/lib/postgresql/data

  asset-visibility-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${SFL_ASSET_VISIBILITY_POSTGRES_USER:-sfl}
      POSTGRES_PASSWORD: ${SFL_ASSET_VISIBILITY_POSTGRES_PASSWORD:-sfl}
      POSTGRES_DB: ${SFL_ASSET_VISIBILITY_POSTGRES_DB:-sfl_asset_visibility_service}
    ports:
      - "5444:5432"
    volumes:
      - sfl_asset_visibility_postgres_data:/var/lib/postgresql/data

  emergency-notification-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${SFL_EMERGENCY_NOTIFICATION_POSTGRES_USER:-sfl}
      POSTGRES_PASSWORD: ${SFL_EMERGENCY_NOTIFICATION_POSTGRES_PASSWORD:-sfl}
      POSTGRES_DB: ${SFL_EMERGENCY_NOTIFICATION_POSTGRES_DB:-sfl_emergency_notification_service}
    ports:
      - "5445:5432"
    volumes:
      - sfl_emergency_notification_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${SFL_RABBITMQ_USER:-sfl}
      RABBITMQ_DEFAULT_PASS: ${SFL_RABBITMQ_PASSWORD:-change-me}
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    # `--import-realm` is the half that was missing. Without it start-dev comes up with no `sfl`
    # realm, so every service's issuer-uri points at a realm that does not exist — and with security
    # now on by default, that is a startup failure rather than a quiet degradation. The realm carries
    # all 26 SflRole values, the site_scopes mapper the actor resolvers already read, and one user per
    # persona so a portal can be signed into rather than only reasoned about.
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${SFL_KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${SFL_KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    healthcheck:
      # Services depend on the realm existing, not merely on the port answering.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/sfl HTTP/1.1
Host: localhost
Connection: close

' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 20

  sfl-facilities-service:
    build:
      context: ../..
      dockerfile: services/sfl-facilities-service/Dockerfile
    environment:
      SFL_PORT: 8080
      SFL_FACILITIES_DB_URL: jdbc:postgresql://facilities-postgres:5432/sfl_facilities_service
      SFL_FACILITIES_DB_USERNAME: ${SFL_FACILITIES_POSTGRES_USER:-sfl}
      SFL_FACILITIES_DB_PASSWORD: ${SFL_FACILITIES_POSTGRES_PASSWORD:-sfl}
      SFL_IAM_ISSUER: http://keycloak:8080/realms/sfl
    ports:
      - "8091:8080"
    depends_on:
      facilities-postgres:
        condition: service_started
      keycloak:
        condition: service_healthy

  sfl-safety-security-service:
    build:
      context: ../..
      dockerfile: services/sfl-safety-security-service/Dockerfile
    environment:
      SFL_PORT: 8080
      SFL_SAFETY_SECURITY_DB_URL: jdbc:postgresql://safety-security-postgres:5432/sfl_safety_security_service
      SFL_SAFETY_SECURITY_DB_USERNAME: ${SFL_SAFETY_SECURITY_POSTGRES_USER:-sfl}
      SFL_SAFETY_SECURITY_DB_PASSWORD: ${SFL_SAFETY_SECURITY_POSTGRES_PASSWORD:-sfl}
      SFL_IAM_ISSUER: http://keycloak:8080/realms/sfl
    ports:
      - "8092:8080"
    depends_on:
      - safety-security-postgres
      - keycloak

  sfl-fleet-logistics-service:
    build:
      context: ../..
      dockerfile: services/sfl-fleet-logistics-service/Dockerfile
    environment:
      SFL_PORT: 8080
      SFL_FLEET_LOGISTICS_DB_URL: jdbc:postgresql://fleet-vehicle-postgres:5432/sfl__fleet_vehicle_service
      SFL_FLEET_LOGISTICS_DB_USERNAME: ${SFL_FLEET_LOGISTICS_POSTGRES_USER:-sfl}
      SFL_FLEET_LOGISTICS_DB_PASSWORD: ${SFL_FLEET_LOGISTICS_POSTGRES_PASSWORD:-sfl}
      SFL_IAM_ISSUER: http://keycloak:8080/realms/sfl
    ports:
      - "8093:8080"
    depends_on:
      - fleet-vehicle-postgres
      - keycloak

  sfl-asset-visibility-service:
    build:
      context: ../..
      dockerfile: services/sfl-asset-visibility-service/Dockerfile
    environment:
      SFL_PORT: 8080
      SFL_ASSET_VISIBILITY_DB_URL: jdbc:postgresql://asset-visibility-postgres:5432/sfl_asset_visibility_service
      SFL_ASSET_VISIBILITY_DB_USERNAME: ${SFL_ASSET_VISIBILITY_POSTGRES_USER:-sfl}
      SFL_ASSET_VISIBILITY_DB_PASSWORD: ${SFL_ASSET_VISIBILITY_POSTGRES_PASSWORD:-sfl}
      SFL_IAM_ISSUER: http://keycloak:8080/realms/sfl
    ports:
      - "8094:8080"
    depends_on:
      - asset-visibility-postgres
      - keycloak

  sfl-emergency-notification-service:
    build:
      context: ../..
      dockerfile: services/sfl-emergency-notification-service/Dockerfile
    environment:
      SFL_PORT: 8080
      SFL_EMERGENCY_NOTIFICATION_DB_URL: jdbc:postgresql://emergency-notification-postgres:5432/sfl_emergency_notification_service
      SFL_EMERGENCY_NOTIFICATION_DB_USERNAME: ${SFL_EMERGENCY_NOTIFICATION_POSTGRES_USER:-sfl}
      SFL_EMERGENCY_NOTIFICATION_DB_PASSWORD: ${SFL_EMERGENCY_NOTIFICATION_POSTGRES_PASSWORD:-sfl}
      SFL_IAM_ISSUER: http://keycloak:8080/realms/sfl
    ports:
      - "8095:8080"
    depends_on:
      - emergency-notification-postgres
      - keycloak

volumes:
  sfl_facilities_postgres_data:
  sfl_safety_security_postgres_data:
  sfl_fleet_vehicle_postgres_data:
  sfl_asset_visibility_postgres_data:
  sfl_emergency_notification_postgres_data:
