services:
  facilities-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${SFL_FACILITIES_POSTGRES_USER:-sfl}
      POSTGRES_PASSWORD: ${SFL_FACILITIES_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${SFL_FACILITIES_POSTGRES_DB:-sfl_facilities_service}
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - sfl_facilities_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SFL_FACILITIES_POSTGRES_USER:-sfl}"]
      interval: 10s
      timeout: 5s
      retries: 10

  safety-security-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${SFL_SAFETY_SECURITY_POSTGRES_USER:-sfl}
      POSTGRES_PASSWORD: ${SFL_SAFETY_SECURITY_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${SFL_SAFETY_SECURITY_POSTGRES_DB:-sfl_safety_security_service}
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - sfl_safety_security_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SFL_SAFETY_SECURITY_POSTGRES_USER:-sfl}"]
      interval: 10s
      timeout: 5s
      retries: 10

  fleet-vehicle-postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${SFL_FLEET_LOGISTICS_POSTGRES_USER:-sfl}
      POSTGRES_PASSWORD: ${SFL_FLEET_LOGISTICS_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${SFL_FLEET_LOGISTICS_POSTGRES_DB:-sfl__fleet_vehicle_service}
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - sfl_fleet_vehicle_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SFL_FLEET_LOGISTICS_POSTGRES_USER:-sfl}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${SFL_RABBITMQ_USER:-sfl}
      RABBITMQ_DEFAULT_PASS: ${SFL_RABBITMQ_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

  idp-postgres:
    # Zitadel requires Postgres (or CockroachDB) as its backing store - there is no embedded/in-memory
    # mode. A dedicated instance, matching how every other service here gets its own Postgres rather
    # than sharing one.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SFL_IDP_POSTGRES_USER:-zitadel}
      POSTGRES_PASSWORD: ${SFL_IDP_POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${SFL_IDP_POSTGRES_DB:-zitadel}
    volumes:
      - sfl_idp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SFL_IDP_POSTGRES_USER:-zitadel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  idp:
    # The platform's OIDC provider. Verified directly (not assumed) against v4.17.3 before this was
    # written: start-from-init against idp-postgres brings up a working instance whose
    # /.well-known/openid-configuration issuer is the bare externalDomain:externalPort - no
    # Keycloak-style /realms/<name> path - which is exactly what every service's SFL_IAM_ISSUER
    # default now expects (see each application.yml).
    #
    # Unlike Keycloak's --import-realm, Zitadel has no single declarative "import this realm" file for
    # provisioning the platform's roles, personas and the site_scopes custom claim - that provisioning
    # is not automated here and must be done once against the running instance's Console
    # (http://localhost:8080/ui/console) or via Zitadel's official Terraform provider. See
    # deploy/idp/README.md.
    image: ghcr.io/zitadel/zitadel:latest
    command: ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "disabled"]
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: idp-postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ${SFL_IDP_POSTGRES_DB:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ${SFL_IDP_POSTGRES_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${SFL_IDP_POSTGRES_PASSWORD:-change-me}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: ${SFL_IDP_POSTGRES_USER:-zitadel}
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${SFL_IDP_POSTGRES_PASSWORD:-change-me}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "8080"
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_MASTERKEY: ${SFL_IDP_MASTERKEY:-ChangeThisMasterkey32Characters!}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${SFL_IDP_ADMIN:-admin}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${SFL_IDP_ADMIN_PASSWORD:-Change-Me-1!}
    depends_on:
      idp-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # No shell in this image (confirmed: `docker exec ... sh` fails with "executable file not
      # found"), so a CMD-SHELL healthcheck can never run here - `zitadel ready` is the binary's own
      # equivalent, needs no shell, and is what this was verified with directly before being written.
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  sfl-facilities-service:
    build:
      context: ../..
      dockerfile: services/sfl-facilities-service/Dockerfile
    environment:
      SFL_PORT: 8080
      SFL_FACILITIES_DB_URL: jdbc:postgresql://facilities-postgres:5432/sfl_facilities_service
      SFL_FACILITIES_DB_USERNAME: ${SFL_FACILITIES_POSTGRES_USER:-sfl}
      SFL_FACILITIES_DB_PASSWORD: ${SFL_FACILITIES_POSTGRES_PASSWORD:-change-me}
      SFL_IAM_ISSUER: http://idp:8080
    ports:
      - "8091:8080"
    depends_on:
      facilities-postgres:
        condition: service_healthy
      idp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  sfl-safety-security-service:
    build:
      context: ../..
      dockerfile: services/sfl-safety-security-service/Dockerfile
    environment:
      SFL_PORT: 8080
      SFL_SAFETY_SECURITY_DB_URL: jdbc:postgresql://safety-security-postgres:5432/sfl_safety_security_service
      SFL_SAFETY_SECURITY_DB_USERNAME: ${SFL_SAFETY_SECURITY_POSTGRES_USER:-sfl}
      SFL_SAFETY_SECURITY_DB_PASSWORD: ${SFL_SAFETY_SECURITY_POSTGRES_PASSWORD:-change-me}
      SFL_IAM_ISSUER: http://idp:8080
    ports:
      - "8092:8080"
    depends_on:
      safety-security-postgres:
        condition: service_healthy
      idp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  sfl-fleet-logistics-service:
    build:
      context: ../..
      dockerfile: services/sfl-fleet-logistics-service/Dockerfile
    environment:
      SFL_PORT: 8080
      SFL_FLEET_LOGISTICS_DB_URL: jdbc:postgresql://fleet-vehicle-postgres:5432/sfl__fleet_vehicle_service
      SFL_FLEET_LOGISTICS_DB_USERNAME: ${SFL_FLEET_LOGISTICS_POSTGRES_USER:-sfl}
      SFL_FLEET_LOGISTICS_DB_PASSWORD: ${SFL_FLEET_LOGISTICS_POSTGRES_PASSWORD:-change-me}
      SFL_IAM_ISSUER: http://idp:8080
    ports:
      - "8093:8080"
    depends_on:
      fleet-vehicle-postgres:
        condition: service_healthy
      idp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # The one dashboard bundle for all three platforms (see sfl-portal-service/pom.xml). It was absent
  # from this file entirely - present in the Maven reactor and in the module docs, but with no
  # deployment path in the topology it actually describes.
  sfl-portal-service:
    build:
      context: ../..
      dockerfile: services/sfl-portal-service/Dockerfile
    environment:
      SFL_PORTAL_PORT: 8080
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/system/info"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

volumes:
  sfl_facilities_postgres_data:
  sfl_safety_security_postgres_data:
  sfl_fleet_vehicle_postgres_data:
  sfl_idp_postgres_data:
