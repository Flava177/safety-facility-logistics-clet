<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SFL Operations — Fleet & Logistics dashboards" />
    <meta name="color-scheme" content="light" />
    <title>SFL Operations — Fleet &amp; Logistics</title>

    <!--
      The CLET design system specifies Roboto Serif for titles and Lato for body text. The
      stylesheet is loaded asynchronously (media="print", switched on load) so that a directorate
      network which cannot reach the font host costs the dashboard a typeface rather than a blank
      screen — a render-blocking <link> to an unreachable origin does exactly that. Both families
      have system fallbacks declared in the theme.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto+Serif:opsz,wght@8..144,400..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Roboto+Serif:opsz,wght@8..144,400..700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
