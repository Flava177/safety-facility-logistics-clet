services:
  facilities-postgres:
    image: postgres:16-bookworm
    container_name: sfl-facilities-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sfl_facilities_service
      POSTGRES_USER: sfl
      POSTGRES_PASSWORD: sfl
    ports:
      - "5441:5432"
    volumes:
      - sfl_facilities_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfl -d sfl_facilities_service"]
      interval: 10s
      timeout: 5s
      retries: 10

  facilities-e2e-postgres:
    image: postgres:16-bookworm
    container_name: sfl-facilities-e2e-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sfl_facilities_service_e2e
      POSTGRES_USER: sfl
      POSTGRES_PASSWORD: sfl
    ports:
      - "55441:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfl -d sfl_facilities_service_e2e"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sfl_facilities_postgres_data:
