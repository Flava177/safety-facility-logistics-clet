services:
  asset-visibility-postgres:
    image: postgres:16-bookworm
    container_name: sfl-asset-visibility-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sfl_asset_visibility_service
      POSTGRES_USER: sfl
      POSTGRES_PASSWORD: sfl
    ports:
      - "5444:5432"
    volumes:
      - sfl_asset_visibility_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfl -d sfl_asset_visibility_service"]
      interval: 10s
      timeout: 5s
      retries: 10

  asset-visibility-e2e-postgres:
    image: postgres:16-bookworm
    container_name: sfl-asset-visibility-e2e-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sfl_asset_visibility_service_e2e
      POSTGRES_USER: sfl
      POSTGRES_PASSWORD: sfl
    ports:
      - "55444:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfl -d sfl_asset_visibility_service_e2e"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sfl_asset_visibility_postgres_data:
