spring:
  application:
    name: sfl
  datasource:
    url: ${SFL_DB_URL:jdbc:postgresql://localhost:5434/sfl_java}
    username: ${SFL_DB_USERNAME:postgres}
    password: ${SFL_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${SFL_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SFL_KEYCLOAK_ISSUER:http://localhost:8080/realms/sfl}
  rabbitmq:
    host: ${SFL_RABBITMQ_HOST:localhost}
    port: ${SFL_RABBITMQ_PORT:5672}
    username: ${SFL_RABBITMQ_USERNAME:sfl}
    password: ${SFL_RABBITMQ_PASSWORD:change-me}
  data:
    redis:
      host: ${SFL_REDIS_HOST:localhost}
      port: ${SFL_REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: ${SFL_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

info:
  app:
    name: ${spring.application.name}
    description: Legacy single-service Java migration reference; active target is four SFL microservices

sfl:
  security:
    enabled: ${SFL_SECURITY_ENABLED:false}

