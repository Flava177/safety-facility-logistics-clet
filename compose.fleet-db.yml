services:
  fleet-postgres:
    image: postgres:16-bookworm
    container_name: sfl-fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sfl_fleet_db
      POSTGRES_USER: sfl
      POSTGRES_PASSWORD: sfl
    ports:
      - "5444:5432"
    volumes:
      - sfl_fleet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfl -d sfl_fleet_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  fleet-e2e-postgres:
    image: postgres:16-bookworm
    container_name: sfl-fleet-e2e-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sfl_fleet_e2e_db
      POSTGRES_USER: sfl
      POSTGRES_PASSWORD: sfl
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfl -d sfl_fleet_e2e_db"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sfl_fleet_postgres_data:
