services:
  safety-security-postgres:
    image: postgres:16-bookworm
    container_name: sfl-safety-security-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sfl_safety_security_service
      POSTGRES_USER: sfl
      POSTGRES_PASSWORD: sfl
    ports:
      - "5442:5432"
    volumes:
      - sfl_safety_security_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfl -d sfl_safety_security_service"]
      interval: 10s
      timeout: 5s
      retries: 10

  safety-security-e2e-postgres:
    image: postgres:16-bookworm
    container_name: sfl-safety-security-e2e-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sfl_safety_security_service_e2e
      POSTGRES_USER: sfl
      POSTGRES_PASSWORD: sfl
    ports:
      - "55442:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfl -d sfl_safety_security_service_e2e"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sfl_safety_security_postgres_data:
