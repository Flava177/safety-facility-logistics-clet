spring:
  application:
    name: sfl-safety-security-service
  datasource:
    url: ${SFL_SAFETY_SECURITY_DB_URL:${SFL_DB_URL:jdbc:postgresql://localhost:5442/sfl_safety_security_service}}
    username: ${SFL_SAFETY_SECURITY_DB_USERNAME:${SFL_DB_USERNAME:sfl}}
    password: ${SFL_SAFETY_SECURITY_DB_PASSWORD:${SFL_DB_PASSWORD:sfl}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # The SSEMP deployable owns two schemas, and Hibernate can only have one default. It is
        # `safety_security`, because that is where the JPA-mapped physical-security and HSE systems
        # will land. S174 is unaffected: its persistence is plain JDBC with every statement
        # schema-qualified (`emergency_notification.activations`, and so on), so it neither reads
        # nor needs this setting. Anything mapped into `emergency_notification` later must therefore
        # carry an explicit @Table(schema = "emergency_notification") - the way AVAMP's entities do
        # in the fleet service - rather than relying on the default and silently resolving here.
        default_schema: safety_security
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # History lives in `safety_security`; both schemas are declared so Flyway creates and manages
    # each one. The two migration series are interleaved in a single version sequence - V1 is the
    # SSEMP foundation, V2-V9 are S174's, renumbered when the emergency deployable was folded in.
    default-schema: safety_security
    schemas: safety_security,emergency_notification
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SFL_IAM_ISSUER:http://localhost:8080}

server:
  port: ${SFL_PORT:8092}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

sfl:
  security:
    # Secure unless deliberately opened, matching the other two platforms. This key was absent
    # entirely, and so was any filter chain to read it - which did not leave the service open, it
    # left Spring Security's default securing everything including /actuator/health, so the service
    # answered 401 to its own probe. See SafetySecurityConfiguration.
    enabled: ${SFL_SECURITY_ENABLED:true}
  service-boundary:
    schema: safety_security,emergency_notification
    owns: "Safety, Security & Emergency Management Platform (SFL.SSEMP) - S160, S160a, S161, S162, S162a, S163 and S174"
  emergency:
    # Outbound provider delivery uses a self-contained transactional outbox with a recorded local sink
    # (no broker required for Phase 1); failed deliveries dead-letter and are replayable.
    messaging:
      transport: ${SFL_EMERGENCY_EVENT_TRANSPORT:local}
      max-attempts: ${SFL_EMERGENCY_OUTBOX_MAX_ATTEMPTS:5}
    scheduling:
      # Unacknowledged-escalation, dashboard-refresh and stale-integration sweeps. Individual sweeps are
      # also toggled by runtime configuration (emergency.scheduling.*-enabled).
      enabled: ${SFL_EMERGENCY_SCHEDULER:true}
      fixed-delay: ${SFL_EMERGENCY_SCHEDULER_DELAY:PT1M}
      initial-delay: ${SFL_EMERGENCY_SCHEDULER_INITIAL_DELAY:PT30S}
