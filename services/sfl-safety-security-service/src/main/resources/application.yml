spring:
  application:
    name: sfl-safety-security-service
  datasource:
    url: ${SFL_SAFETY_SECURITY_DB_URL:${SFL_DB_URL:jdbc:postgresql://localhost:5442/sfl_safety_security_service}}
    username: ${SFL_SAFETY_SECURITY_DB_USERNAME:${SFL_DB_USERNAME:sfl}}
    password: ${SFL_SAFETY_SECURITY_DB_PASSWORD:${SFL_DB_PASSWORD:sfl}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: safety_security
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: safety_security
    schemas: safety_security
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SFL_IAM_ISSUER:http://localhost:8080/realms/sfl}

server:
  port: ${SFL_PORT:8092}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

sfl:
  security:
    # Secure unless deliberately opened, matching the other four services. This key was absent
    # entirely, and so was any filter chain to read it — which did not leave the service open, it
    # left Spring Security's default securing everything including /actuator/health, so the service
    # answered 401 to its own probe. See SafetySecurityConfiguration.
    enabled: ${SFL_SECURITY_ENABLED:true}
  service-boundary:
    schema: safety_security
    owns: "Safety and security service for S160, S160a, S161, S162, S162a and S163"

