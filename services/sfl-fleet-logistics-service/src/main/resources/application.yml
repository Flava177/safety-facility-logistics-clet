spring:
  application:
    name: sfl-fleet-logistics-service
  datasource:
    url: ${SFL_DB_URL:jdbc:postgresql://localhost:5434/sfl_fleet_logistics_service}
    username: ${SFL_DB_USERNAME:postgres}
    password: ${SFL_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: fleet_logistics
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: fleet_logistics
    schemas: fleet_logistics
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SFL_IAM_ISSUER:http://localhost:8080/realms/sfl}

server:
  port: ${SFL_PORT:8093}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

sfl:
  service-boundary:
    schema: fleet_logistics
    owns: "Fleet and logistics service for S166, S168_fuel and S171"

