spring:
  application:
    name: sfl-fleet-logistics-service
  datasource:
    url: ${SFL_FLEET_LOGISTICS_DB_URL:${SFL_DB_URL:jdbc:postgresql://localhost:5443/sfl__fleet_vehicle_service}}
    username: ${SFL_FLEET_LOGISTICS_DB_USERNAME:${SFL_DB_USERNAME:sfl}}
    password: ${SFL_FLEET_LOGISTICS_DB_PASSWORD:${SFL_DB_PASSWORD:sfl}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: fleet_logistics
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: fleet_logistics
    schemas: fleet_logistics
    locations: classpath:db/migration
  rabbitmq:
    host: ${SFL_RABBITMQ_HOST:localhost}
    port: ${SFL_RABBITMQ_PORT:5672}
    username: ${SFL_RABBITMQ_USERNAME:guest}
    password: ${SFL_RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SFL_IAM_ISSUER:http://localhost:8080/realms/sfl}

server:
  port: ${SFL_PORT:8093}
  shutdown: graceful

management:
  health:
    rabbit:
      enabled: ${SFL_RABBITMQ_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

sfl:
  service-boundary:
    schema: fleet_logistics
    owns: "S166 Fleet and Vehicle Management, S168_fuel Fuel Management and Driver Logbooks, and S171 Mailroom / Courier and Dispatch Tracking"
  security:
    # false uses the X-SFL-* development actor headers; true enables the OIDC/JWT resource server.
    enabled: ${SFL_SECURITY_ENABLED:false}
  fleet:
    messaging:
      # local    — events are delivered to the in-process transport and logged (no broker provisioned).
      # rabbitmq — events are published to the sfl.events exchange.
      # Selecting rabbitmq without a broker fails at startup rather than silently dropping events.
      transport: ${SFL_FLEET_EVENT_TRANSPORT:local}
      exchange: ${SFL_FLEET_EVENT_EXCHANGE:sfl.events}
      drain-batch-size: 50
    notification:
      # recorded — notification intents are persisted and logged; no provider is procured for Phase 1.
      provider: ${SFL_FLEET_NOTIFICATION_PROVIDER:recorded}
    scheduling:
      outbox:
        enabled: ${SFL_FLEET_OUTBOX_SCHEDULER:true}
        fixed-delay: PT5S
        initial-delay: PT10S
      sla:
        enabled: ${SFL_FLEET_SLA_SCHEDULER:true}
        fixed-delay: PT1M
        initial-delay: PT30S
      compliance:
        enabled: ${SFL_FLEET_COMPLIANCE_SCHEDULER:true}
        cron: ${SFL_FLEET_COMPLIANCE_CRON:0 5 1 * * *}
      dashboard:
        enabled: ${SFL_FLEET_DASHBOARD_SCHEDULER:true}
        fixed-delay: PT5M
        initial-delay: PT20S
  fuel:
    scheduling:
      enabled: ${SFL_FUEL_SCHEDULER:true}
      fixed-delay: ${SFL_FUEL_SCHEDULER_DELAY:PT5M}
      initial-delay: ${SFL_FUEL_SCHEDULER_INITIAL_DELAY:PT45S}
  dispatch:
    scheduling:
      # S171 undelivered-item, outstanding-return, exception-SLA, dashboard-refresh and stale-integration
      # sweeps. Individual sweeps are also toggled by runtime configuration (dispatch.scheduling.*-enabled)
      # so operations can disable one without a redeploy.
      enabled: ${SFL_DISPATCH_SCHEDULER:true}
      fixed-delay: ${SFL_DISPATCH_SCHEDULER_DELAY:PT5M}
      initial-delay: ${SFL_DISPATCH_SCHEDULER_INITIAL_DELAY:PT50S}
