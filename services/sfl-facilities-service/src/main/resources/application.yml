spring:
  application:
    name: sfl-facilities-service
  datasource:
    url: ${SFL_FACILITIES_DB_URL:${SFL_DB_URL:jdbc:postgresql://localhost:5441/sfl_facilities_service}}
    username: ${SFL_FACILITIES_DB_USERNAME:${SFL_DB_USERNAME:sfl}}
    password: ${SFL_FACILITIES_DB_PASSWORD:${SFL_DB_PASSWORD:sfl}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: facilities
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: facilities
    schemas: facilities
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SFL_IAM_ISSUER:http://localhost:8080/realms/sfl}

server:
  port: ${SFL_PORT:8091}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

sfl:
  service-boundary:
    schema: facilities
    owns: "Facilities service for S152, S153 and S159"
  security:
    enabled: ${SFL_SECURITY_ENABLED:false}
